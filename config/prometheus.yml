global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888'] # collector's own health metrics (otelcol_*)

  - job_name: 'otel-collector-app-metrics'
    honor_labels: true # keep the app's own "job"/"instance" labels instead of overwriting them with this scrape job's name
    static_configs:
      - targets: ['otel-collector:8889'] # metrics forwarded from instrumented apps (OTLP -> prometheus exporter)
