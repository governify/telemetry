global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# OTLP push (collector -> /api/v1/otlp).
# Prometheus always maps service.namespace/service.name to `job` ("<namespace>/<name>") and
# service.instance.id to `instance`; those three are listed again in promote_resource_attributes so
# metrics also carry plain service_namespace / service_name / service_instance_id labels (which the
# dashboards query), and keep_identifying_resource_attributes keeps them on target_info too.
# The label contract lives in generators/README.md — keep this list in sync with it.
otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - service.version
    - deployment.environment.name
    - deployment.environment
    - host.name
    - host.id
    - os.type
    - k8s.cluster.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.pod.uid
    - k8s.deployment.name
    - k8s.statefulset.name
    - k8s.daemonset.name
    - k8s.container.name
    - container.name
    - container.id
    - container.image.name
    - cloud.provider
    - cloud.region

storage:
  tsdb:
    out_of_order_time_window: 30m # OTLP batches from several senders arrive slightly out of order
  exemplars:
    max_exemplars: 200000

scrape_configs:
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888'] # collector's own health metrics (otelcol_*)
