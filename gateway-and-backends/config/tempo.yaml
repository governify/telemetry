server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# RED metrics + service graph derived from traces, remote-written to Prometheus.
# Works for any language/runtime that sends spans, independent of metric semconv versions.
metrics_generator:
  registry:
    collection_interval: 15s
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    span_metrics:
      # resource/span attributes exposed as labels on traces_spanmetrics_* ("." becomes "_").
      # server.address is deliberately absent: on server spans it is the pod IP (cardinality trap);
      # outbound dependencies are covered by the service graph and http_client_* metrics.
      dimensions:
        - service.namespace
        - deployment.environment.name
        - http.route
        - http.request.method
        - http.response.status_code
        - db.system.name
        - db.system
      enable_target_info: true
    service_graphs:
      dimensions:
        - service.namespace
      peer_attributes:
        - peer.service
        - db.system.name
        - db.system
        - server.address
      enable_virtual_node_label: true # calls to databases / external hosts show up as nodes

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
