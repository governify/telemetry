services:
  telemetry-caddy:
    image: caddy:latest
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - ./landing:/srv/landing:ro
      - caddy-data:/data
      - caddy-config:/config
    expose:
      - 80
      - 443
    depends_on:
      - grafana
      - otel-collector
    networks:
      - telemetry

  tempo:
    image: grafana/tempo:3.0.0
    command:
      - -target=all
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    expose:
      - 3200 # tempo query frontend (used by grafana)
      - 4317 # otlp grpc receiver (used by otel-collector)
      - 4318 # otlp http receiver
    networks:
      - telemetry

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    expose:
      - 9090
    networks:
      - telemetry

  loki:
    image: grafana/loki:latest
    expose:
      - 3100
    volumes:
      - loki-data:/loki
    networks:
      - telemetry

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./config/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./dashboards:/etc/grafana/provisioning/dashboards/files
      - grafana-data:/var/lib/grafana
    expose:
      - 3000
    depends_on:
      - tempo
      - prometheus
      - loki
    networks:
      - telemetry

  otel-collector:
    image: otel/opentelemetry-collector
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports: # HOST:CONTAINER
      - 4318:4318 # OTLP http receiver
      - 4317:4317 # OTLP gRPC receiver
    expose:
      - 4318 # OTLP http receiver
      - 4317 # OTLP gRPC receiver
      - 1888 # pprof extension
      - 8888 # Prometheus metrics exposed by the Collector
      - 8889 # Prometheus exporter metrics
      - 13133 # health_check extension
      - 55679 # zpages extension
    networks:
      - telemetry

  # telemetrygen:
  #   image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
  #   command:
  #     - traces
  #     - --otlp-http
  #     - --otlp-endpoint=otel-collector:4318
  #     - --otlp-http-url-path=/v1/traces
  #     - --otlp-insecure
  #     - --duration=30s
  #   depends_on:
  #     - otel-collector
  #   networks:
  #     - telemetry

networks:
  telemetry:
    external: true

volumes:
  tempo-data:
  prometheus-data:
  loki-data:
  grafana-data:
  caddy-data:
  caddy-config:
